<div class="favorites-container">
  <main class="favorites-section">
    <h1 class="section-title">Mis Favoritos</h1>

    <div class="movies-grid" *ngIf="favoriteMovies().length > 0">
      
      <article class="movie-card" *ngFor="let movie of favoriteMovies()" [routerLink]="['/movie', movie.id]" style="cursor: pointer;">
        <div class="poster-wrapper">
          <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" class="movie-poster">
          
          <button class="btn-remove" (click)="removeFromFavorites(movie.id); $event.stopPropagation()" title="Quitar de favoritos">
            <svg viewBox="0 0 24 24" class="icon-trash">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
          </button>
        </div>
        
        <div class="movie-info">
          <h3 class="movie-title" [title]="movie.title">{{ movie.title }}</h3>
          <div class="movie-meta">
            <span class="rating">
              <svg viewBox="0 0 24 24" class="icon-star"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              {{ movie.vote_average | number:'1.1-1' }}
            </span>
            <span class="release-date">{{ movie.release_date | date:'yyyy' }}</span>
          </div>
        </div>
      </article>

    </div>

    <div class="empty-state" *ngIf="favoriteMovies().length === 0">
      <div class="empty-icon-wrapper">
        <svg viewBox="0 0 24 24" class="icon-heart-empty">
          <path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.5 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/>
        </svg>
      </div>
      <h2>Tu lista está vacía</h2>
      <p>Aún no has guardado ninguna película en tus favoritos. Explora el catálogo de populares y añade tus preferidas.</p>
      <a [routerLink]="['/']" class="btn-browse">Descubrir películas</a>
    </div>

  </main>
</div>
