<div class="home-container">
  
  <header class="hero-banner" *ngIf="movies().length > 0">
    <div class="hero-overlay"></div>
    <img [src]="'https://image.tmdb.org/t/p/original' + movies()[0].backdrop_path" [alt]="movies()[0].title" class="hero-bg">
    
    <div class="hero-content">
      <h1 class="hero-title">{{ movies()[0].title }}</h1>
      
      <p class="hero-description">
        {{ movies()[0].overview || 'Descubre los detalles de esta producción en el catálogo.' }}
      </p>
      
      <button class="btn-primary" (click)="goToDetail(movies()[0].id)">Explorar ahora</button>
    </div>
  </header>

  <main class="movies-section">
    <h2 class="section-title">Películas Populares</h2>
    
    <div class="movies-grid">
      
      <article class="movie-card" *ngFor="let movie of movies()" (click)="goToDetail(movie.id)" style="cursor: pointer;">
        
        <div class="poster-wrapper">
          <img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path" [alt]="movie.title" class="movie-poster">
          
          <button 
            class="btn-favorite-toggle" 
            [class.is-fav]="isMovieFavorite(movie.id)"
            (click)="toggleFavorite(movie); $event.stopPropagation()" 
            title="Guardar en favoritos"
          >
            <svg viewBox="0 0 24 24" class="icon-heart-toggle">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>
        
        <div class="movie-info">
          <h3 class="movie-title" [title]="movie.title">{{ movie.title }}</h3>
          <div class="movie-meta">
            <span class="rating">
              <svg viewBox="0 0 24 24" class="icon-star"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
              {{ movie.vote_average | number:'1.1-1' }}
            </span>
            <span class="release-date">{{ movie.release_date | date:'yyyy' }}</span>
          </div>
        </div>

      </article>

    </div>

    <div class="pagination-container" *ngIf="movies().length > 0">
      <button class="btn-secondary" (click)="loadMoreMovies()">Cargar más</button>
    </div>
  </main>
</div>
